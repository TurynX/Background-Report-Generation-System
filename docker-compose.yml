version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: background-report-generation-system-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: background_report_generation_system_db
    ports:
      - '5433:5432'
    volumes:
      - ./docker/data/dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: background-report-generation-system-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: background-report-generation-system-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: rootadmin
      MINIO_ROOT_PASSWORD: rootpassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  redis_data:
  minio_data:
