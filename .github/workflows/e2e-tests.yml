name: End-to-End Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: background_report_generation_system_db_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio_test:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: rootadmin
          MINIO_ROOT_PASSWORD: rootpassword123
        ports:
          - 9002:9000
          - 9003:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5434/background_report_generation_system_db_test
          NODE_ENV: test

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5434/background_report_generation_system_db_test
          NODE_ENV: test

      - name: Execute E2E Tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5434/background_report_generation_system_db_test
          NODE_ENV: test
          JWT_SECRET_KEY: supersecret
          JWT_EXPIRES_IN: 7d
          BUCKET_NAME: report-bucket
          BUCKET_ENDPOINT: http://localhost:9002
          BUCKET_REGION: us-east-1
          BUCKET_ACCESS_KEY: rootadmin
          BUCKET_SECRET_KEY: rootpassword123
          MINIO_ENDPOINT: http://localhost:9002
